<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Creater v0.3 dev</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/semantic.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">GAME ASSET FACTORY</p>
        <h1>游戏素材 AI 生产工具 <span>v0.3 dev</span></h1>
      </div>
      <div id="health" class="status">连接中…</div>
    </header>

    <section class="card semantic-panel">
      <div class="semantic-head">
        <div>
          <h2>游戏素材语义联想</h2>
          <p>中文概念 → 本地素材本体 → 关键词组 → GroundingDINO 英文 Prompt</p>
        </div>
        <span class="semantic-badge">OFFLINE · NO API</span>
      </div>

      <div class="semantic-controls">
        <label>
          <span>场景 / 概念关键词</span>
          <input id="semanticInput" value="废弃地铁站" placeholder="例如：魔法森林、赛博朋克小巷、海边渔村" />
        </label>
        <label>
          <span>展开深度</span>
          <select id="semanticDepth">
            <option value="1">1 · 基础</option>
            <option value="2" selected>2 · 状态组合</option>
            <option value="3">3 · 深度</option>
          </select>
        </label>
        <label>
          <span>每组上限</span>
          <select id="semanticMaxPerGroup">
            <option value="8">8</option>
            <option value="12" selected>12</option>
            <option value="20">20</option>
            <option value="30">30</option>
          </select>
        </label>
        <div class="semantic-actions">
          <button id="semanticExpandBtn">生成关键词组</button>
          <button id="semanticApplyBtn" disabled>应用到拆图</button>
          <button id="semanticAnalyzeBtn" disabled>联想并拆图</button>
          <button id="semanticRecommendBtn" disabled>检查缺失素材</button>
        </div>
      </div>

      <div id="semanticExamples" class="semantic-examples"></div>

      <div id="semanticResult" class="semantic-result hidden">
        <div id="semanticSummary" class="semantic-summary"></div>
        <div id="semanticGroups" class="semantic-groups"></div>
        <div id="semanticRecommendations" class="semantic-recommendations hidden"></div>
      </div>
    </section>

    <section class="toolbar card">
      <label class="upload">
        <strong>场景图片</strong>
        <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" />
        <span id="fileName">选择 PNG / JPG / WEBP</span>
      </label>
      <label>
        <strong>目标关键词 / GroundingDINO Prompt</strong>
        <input id="promptInput" value="tree, rock, house, crate, grass" />
      </label>
      <button id="analyzeBtn">AI 拆解</button>
    </section>

    <section class="workspace">
      <aside class="card panel">
        <div class="panel-title">Asset Tree</div>
        <div id="selectionBar" class="selection-bar hidden">
          <span id="selectionCount">已选 0</span>
          <button id="mergeSelectedBtn" disabled>合并选中</button>
        </div>
        <div id="assetList" class="asset-list empty">尚未分析场景</div>
      </aside>

      <section class="card panel viewer-panel">
        <div class="panel-title">Scene Viewer · 拖拽矩形可辅助拆分</div>
        <div class="viewer">
          <div id="viewerStage" class="viewer-stage">
            <img id="scenePreview" alt="场景预览" />
            <canvas id="selectionCanvas" aria-label="矩形拆分选择层"></canvas>
          </div>
          <div id="viewerHint">上传图片后在这里预览</div>
        </div>
      </section>

      <aside class="card panel">
        <div class="panel-title">Asset Preview / Editor</div>
        <div id="assetPreview" class="asset-preview empty">点击左侧素材查看</div>
      </aside>
    </section>

    <section class="card footerbar">
      <span id="message">先输入中文概念生成素材关键词，也可以直接上传图片并手动输入检测 Prompt。</span>
      <div class="footer-actions">
        <a id="manifestLink" class="hidden" target="_blank">打开 scene.json</a>
        <a id="archiveLink" class="hidden">下载全部 ZIP</a>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
  <script src="/semantic.js"></script>
</body>
</html>

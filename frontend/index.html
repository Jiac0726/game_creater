<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Creater v0.2 dev</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">GAME ASSET FACTORY</p>
        <h1>游戏素材 AI 拆解器 <span>v0.2 dev</span></h1>
      </div>
      <div id="health" class="status">连接中…</div>
    </header>

    <section class="toolbar card">
      <label class="upload">
        <strong>场景图片</strong>
        <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" />
        <span id="fileName">选择 PNG / JPG / WEBP</span>
      </label>
      <label>
        <strong>目标关键词</strong>
        <input id="promptInput" value="tree, rock, house, crate, grass" />
      </label>
      <button id="analyzeBtn">AI 拆解</button>
    </section>

    <section class="workspace">
      <aside class="card panel">
        <div class="panel-title">Asset Tree</div>
        <div id="selectionBar" class="selection-bar hidden">
          <span id="selectionCount">已选 0</span>
          <button id="mergeSelectedBtn" disabled>合并选中</button>
        </div>
        <div id="assetList" class="asset-list empty">尚未分析场景</div>
      </aside>

      <section class="card panel viewer-panel">
        <div class="panel-title">Scene Viewer · Mask / BBox Overlay</div>
        <div class="viewer">
          <img id="scenePreview" alt="场景预览" />
          <div id="viewerHint">上传图片后在这里预览</div>
        </div>
      </section>

      <aside class="card panel">
        <div class="panel-title">Asset Preview / Editor</div>
        <div id="assetPreview" class="asset-preview empty">点击左侧素材查看</div>
      </aside>
    </section>

    <section class="card footerbar">
      <span id="message">上传图片后可 AI 拆解，并手动删除、合并或矩形拆分 Mask。</span>
      <div class="footer-actions">
        <a id="manifestLink" class="hidden" target="_blank">打开 scene.json</a>
        <a id="archiveLink" class="hidden">下载全部 ZIP</a>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
